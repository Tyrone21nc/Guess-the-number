<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Guess the Number</h2>
    <div class="num">
        <button id="one" class="nums">1</button>
        <button id="two" class="nums">2</button>
        <button id="three" class="nums">3</button>
        <button id="four" class="nums">4</button>
        <button id="five" class="nums">5</button>
        <button id="six" class="nums">6</button>
        <button id="seven" class="nums">7</button>
        <button id="eight" class="nums">8</button>
        <button id="nine" class="nums">9</button>
        <button id="ten" class="nums">10</button>
    </div>
    <br><br>
    <h4 class="cnt">Counter Value: </h4>
    <h4 id="countValue"></h4>
    <h4 id="secondValue"></h4>

    <br><br><br>
    <div class="ending">
        <h3 id="won"></h3>
        <h3 id="lost"></h3>  
        <br><br>      
        <div class="myimg">
            <img id="wonimg" src="barb.gif" alt="Goblin from Clash Royale">
        </div>
    </div>




    <script src="script.js"></script>
</body>
</html>
